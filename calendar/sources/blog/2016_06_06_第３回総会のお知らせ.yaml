title: 第３回総会のお知らせ
published: '2016-06-05'
body: |-
  ６月１９日（日）、第３回総会を行います。
  議案は、昨年度の活動報告と会計報告、今年度の活動計画と予算案などについてです。

  日時：６月１９日（日）　午前９時３０分
  場所：飯能市加治東公民館（クリックで地図が開きます） ２階

  ご参集のほど、どうぞ宜しくお願いいたします。
