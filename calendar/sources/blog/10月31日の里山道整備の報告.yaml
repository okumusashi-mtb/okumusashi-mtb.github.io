title: 10月31日の里山道整備の報告
published: '2026-11-01'
body: |-
  会員さんであるローカルマウンテンバイカー8名が集まり、里山道の整備作業を行いました。

  今回の作業では、3か所で合計9本の倒木を撤去することができました。
  8〜9月の長雨で弱っていた樹木が一気に倒れ、たくさんの倒木が道を塞いでしまっていましたが、歩行者はもちろん、マウンテンバイカーやグラベルライダーにとっても、だいぶ通行しやすくなりました。
  次回の活動は11月29日（日）です。
  飯能市民清掃デーに合わせて、地元自治会の皆さんの作業に加えていただき、森の入り口の草刈りや倒木の撤去などを行う予定です。 地域の皆さんと一緒に、気持ちよく利用できる里山環境を守っていきたいと思います。 ご協力いただける皆さんの参加をお待ちしています！
