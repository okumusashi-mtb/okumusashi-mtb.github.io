title: 10/25日高市清掃作業の報告
published: '2026-10-31'
body: 10月25日は日高市ごみゼロの日に伴い、周辺地域との共同作業を行いました。OMCからの参加者は7名。まずはホウキで側溝に溜まった土砂や落ち葉を掃き出し、ブロワー4台態勢で撤去しました。1時間半ほどで1km以上を清掃しました。参加された皆さん、お疲れ様でした。
