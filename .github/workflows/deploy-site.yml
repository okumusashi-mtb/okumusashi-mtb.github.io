name: Deploy site to Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'calendar/events/**', 'calendar/sources/blog/**', '.github/workflows/deploy-site.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      # 画像変換結果のキャッシュ。npm ci が node_modules を作り直すので必ずその後に復元する。
      # 写真・依存・base 設定のいずれかが変わるとキーが変わるが、restore-keys で
      # 直前のキャッシュを引き継ぎ、変更のない写真は再変換せずに済む。
      - uses: actions/cache@v6
        with:
          path: site/node_modules/.astro
          key: astro-assets-${{ hashFiles('site/package-lock.json', 'site/astro.config.mjs', 'site/src/assets/photos/**') }}
          restore-keys: astro-assets-
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
